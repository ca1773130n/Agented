# v0.5.13: production Docker Compose for Agented.
# Two services share the same image; sidecar overrides the command.
#
# Bring up:   just docker-up
# Tail logs:  just docker-logs
# Tear down:  just docker-down
#
# Secrets via *_FILE convention — see docs/deploy/SECRETS.md.

services:
  agented-backend:
    # Build context is the PARENT of Agented so ai-accounts/ is reachable.
    build:
      context: ..
      dockerfile: Agented/Dockerfile
    image: ghcr.io/ca1773130n/agented:${GHCR_TAG:-latest}
    container_name: agented-backend
    env_file:
      - .env
    environment:
      AGENTED_ENV: production
      AGENTED_DB_PATH: /app/data/agented.db
      # v0.5.15: snapshot dir lives on the dedicated backups volume
      # so `docker exec agented-backend just backup` writes to a
      # host-visible location (default volume binds to ./backups).
      AGENTED_BACKUP_DIR: /app/backups
      # In compose the sidecar is a separate DNS name; the in-image
      # HEALTHCHECK uses --liveness-only and probes only this container.
      AGENTED_BACKEND_URL: http://127.0.0.1:20000
    ports:
      - "20000:20000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "scripts/healthcheck.py", "--liveness-only"]
      interval: 30s
      timeout: 10s
      retries: 3
    volumes:
      - agented-data:/app/data
      - agented-backups:/app/backups

  agented-sidecar:
    image: ghcr.io/ca1773130n/agented:${GHCR_TAG:-latest}
    container_name: agented-sidecar
    command: ["python", "scripts/run_ai_accounts.py"]
    env_file:
      - .env
    environment:
      AGENTED_ENV: production
      AGENTED_DB_PATH: /app/data/agented.db
      AGENTED_BACKUP_DIR: /app/backups
    ports:
      - "20001:20001"
    restart: unless-stopped
    depends_on:
      agented-backend:
        condition: service_started
    volumes:
      - agented-data:/app/data
      - agented-backups:/app/backups

volumes:
  agented-data:
  # v0.5.15: dedicated backup volume — survives container replacement;
  # operator can rsync/copy /var/lib/docker/volumes/agented-backups/ off-host.
  agented-backups:
